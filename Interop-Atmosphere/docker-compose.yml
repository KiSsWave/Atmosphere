version: '3.8'

services:
  php-apache:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - HTTP_PROXY=http://127.0.0.1:8080
      - HTTPS_PROXY=http://127.0.0.1:8080
      - NO_PROXY=localhost,127.0.0.1
